spring.application.name=ritech-backend

# Database connection - Aiven MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://ritech-mysql-campusucc-6c35d.aivencloud.com:10792/ritech_sas?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}

# Session cookie configuration for frontend/backend on different domains
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Error handling
server.error.include-stacktrace=never
server.error.include-message=never
spring.servlet.error.include-binding-errors=never