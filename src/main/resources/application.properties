spring.application.name=ritech-backend

# Aiven MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://ritech-mysql-campusucc-6c35.d.aivencloud.com:10792/ritech_sas?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validate existing schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.json_format_mapper=jsonb

server.port=${PORT:8080}
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

app.cors.allowed-origin=${FRONTEND_URL:https://frontend-ritech.onrender.com}

server.error.include-stacktrace=never
server.error.include-message=always
spring.servlet.error.include-binding-errors=never